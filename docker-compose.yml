services:
  unsloth:
    build: .
    container_name: llm-lab
    restart: unless-stopped
    command: sleep infinity
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - .:/workspace
    working_dir: /workspace
    environment:
      - PYTHONPATH=/workspace
      - HF_HUB_OFFLINE=1
    ipc: host