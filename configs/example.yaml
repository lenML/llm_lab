model:
  source: modelscope          # huggingface | modelscope
  name_or_path: ./models/unsloth/Qwen3___5-0___8B
  load_in_4bit: false

max_seq_length: 2048

data:
  path: ./data/train.jsonl
  format: messages
  max_samples: 100

training:
  algorithm: sft                # sft | grpo
  output_dir: ./outputs
  batch_size: 2
  learning_rate: 2.0e-4
  epochs: 1
  logging_steps: 10
  save_steps: 100